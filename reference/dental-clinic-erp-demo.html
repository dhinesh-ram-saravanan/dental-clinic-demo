<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic ERP – Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f2ee;--surface:#ffffff;--sunk:#eaece7;--ink:#14201c;--muted:#5c6964;--line:#dce1db;
  --pri:#1d4a3f;--pri-ink:#ffffff;--pri-soft:#e1ebe5;--brass:#ad874b;
  --side-bg:#0f231e;--side-ink:#eef2ef;--side-muted:#9cb1a9;--side-hover:#183129;--side-active:#213f36;
  --ok:#2c7650;--ok-soft:#e2f0e6;--warn:#9b5f17;--warn-soft:#f6ecdc;--bad:#a5322a;--bad-soft:#f8e8e5;
  --enamel:#fbfaf6;--root:#ece2cf;--tline:#99a39e;
  --t-decay:#c27a2a;--t-filled:#3a6898;--t-rct:#7a4b76;--t-crown:#ad874b;--t-implant:#2a786a;--t-missing:#99a39e;
  --lift:0 1px 2px rgba(16,24,40,.05),0 0 0 1px var(--line);
  --float:0 10px 30px rgba(16,24,40,.16),0 0 0 1px rgba(16,24,40,.06);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1311;--surface:#131c19;--sunk:#1a2420;--ink:#e6ece8;--muted:#97a8a1;--line:#25312d;
  --pri:#8cc7b1;--pri-ink:#0b1f1a;--pri-soft:#1a2f28;--brass:#c9a46a;
  --side-bg:#080e0c;--side-ink:#e6ece8;--side-muted:#8ea39b;--side-hover:#13201b;--side-active:#1b2d27;
  --ok:#6fcf9c;--ok-soft:#14301f;--warn:#e2b06a;--warn-soft:#30250f;--bad:#ee8a7f;--bad-soft:#3a1a16;
  --enamel:#ebe7dc;--root:#c9bca2;--tline:#6f7b76;
  --t-decay:#e09a45;--t-filled:#6f9bd0;--t-rct:#b083ab;--t-crown:#c9a46a;--t-implant:#4fb09c;--t-missing:#5c6964;
  --lift:0 0 0 1px var(--line);--float:0 10px 30px rgba(0,0,0,.5),0 0 0 1px var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1311;--surface:#131c19;--sunk:#1a2420;--ink:#e6ece8;--muted:#97a8a1;--line:#25312d;
  --pri:#8cc7b1;--pri-ink:#0b1f1a;--pri-soft:#1a2f28;--brass:#c9a46a;
  --side-bg:#080e0c;--side-ink:#e6ece8;--side-muted:#8ea39b;--side-hover:#13201b;--side-active:#1b2d27;
  --ok:#6fcf9c;--ok-soft:#14301f;--warn:#e2b06a;--warn-soft:#30250f;--bad:#ee8a7f;--bad-soft:#3a1a16;
  --enamel:#ebe7dc;--root:#c9bca2;--tline:#6f7b76;
  --t-decay:#e09a45;--t-filled:#6f9bd0;--t-rct:#b083ab;--t-crown:#c9a46a;--t-implant:#4fb09c;--t-missing:#5c6964;
  --lift:0 0 0 1px var(--line);--float:0 10px 30px rgba(0,0,0,.5),0 0 0 1px var(--line);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--paper);background-image:var(--bg-fade,none);background-attachment:fixed;color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--surface);box-shadow:1px 0 0 var(--line);z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{display:block;font-size:15px;line-height:1.25}
.logo{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.demo{font-size:11px;font-weight:700;color:var(--warn)}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .15s,color .15s}
#nav a:hover{background:var(--sunk);color:var(--ink)}
#nav a.on{background:var(--pri-soft);color:var(--pri)}
#nav svg{flex:0 0 18px}
.count{margin-left:auto;min-width:22px;text-align:center;background:var(--pri);color:var(--pri-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
.golive{margin:0 0 10px}
.who{margin-top:auto;padding:0 6px}
.who label{margin:0}
main{padding:30px 34px 110px;max-width:1260px;width:100%}
.app.bare{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.app.bare main{margin:0 auto}
.app.bare #side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 20px}
.app.kiosk #side{display:none}
.livebar{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
.livebar .grow{flex:1}
.livebar select{width:auto}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@media(max-width:899px){
  .app{grid-template-columns:1fr}
  #side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand who" "nav nav";gap:8px;padding:10px 12px 0}
  .brand{grid-area:brand;padding:0}.who{grid-area:who;margin:0;padding:0}.who label{flex-direction:row;align-items:center;font-size:12px}.who select{width:auto;max-width:150px;padding:6px 8px}
  #nav{grid-area:nav;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 8px 8px}
  #nav a{padding:7px 10px}#nav a .count{margin-left:4px}
  .golive{margin:0}
  main{padding:18px 14px 110px}
}

/* type + basics */
h1{font-size:28px;line-height:1.15;font-weight:750;letter-spacing:-.022em;margin:0}
h2{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border-radius:14px;box-shadow:var(--lift);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:899px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri);margin:0}
textarea{resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 14px}
.span2{grid-column:1/-1}
@media(max-width:600px){.fgrid,.fgrid3{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{flex-direction:row;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:7px 13px;margin:0;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;transition:background-color .15s}
.chip:has(input:checked){background:var(--pri-soft);color:var(--pri)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:500;font-size:14px}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--sunk);color:var(--ink);border-radius:9px;padding:9px 14px;min-height:40px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background-color .15s,transform .1s}
.btn:hover{background:color-mix(in srgb,var(--sunk) 70%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--pri) 88%,var(--ink))}
.btn.sm{padding:6px 11px;font-size:13px;min-height:34px}
.btn.lg{padding:12px 20px;font-size:15px;min-height:46px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.wa{background:#25d366;color:#05301a}
.btn:disabled{opacity:.6;cursor:wait}
.icon{border:0;background:transparent;color:var(--muted);border-radius:9px;width:40px;height:40px;flex:0 0 40px;cursor:pointer;font-size:20px;line-height:1}
.icon:hover{background:var(--sunk);color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.pri{background:var(--pri-soft);color:var(--pri)}
.alerts{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td select{width:auto;padding:6px 8px}
.row-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row-item:last-child{border-bottom:0}
.row-item.click{cursor:pointer}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-actions select,.row-actions input{width:auto}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty p{margin:0 0 14px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}

/* dashboard */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border-radius:14px;box-shadow:var(--lift);margin-bottom:16px;overflow:hidden}
.ledger>div{padding:16px 18px;box-shadow:-1px 0 0 var(--line)}
.fig-l{font-size:13px;color:var(--muted);font-weight:600}
.fig-v{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.fig-s{font-size:12px;color:var(--muted)}
.prog{width:96px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px}

/* queue */
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.tok{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:750;font-variant-numeric:tabular-nums}
.qrow.in .tok{background:var(--warn-soft);color:var(--warn)}
.qmeta{font-size:13px;color:var(--muted)}
.late{color:var(--warn);font-weight:600}
@media(max-width:700px){.qrow{grid-template-columns:40px minmax(0,1fr)}.qrow>.qdoc,.qrow>.qact{grid-column:2}}

/* live */
.chair{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:24px 26px 24px 32px;border-radius:18px;background:var(--surface);box-shadow:var(--lift);margin-bottom:18px;overflow:hidden}
.chair::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--ok)}
.chair.busy::before{background:var(--warn)}
.chair-k{font-size:13px;font-weight:600;color:var(--muted)}
.chair-name{font-size:32px;font-weight:750;letter-spacing:-.025em;line-height:1.15;margin:2px 0 8px}
@media(max-width:600px){.chair{grid-template-columns:1fr}.chair-name{font-size:26px}}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.col{background:var(--sunk);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px 6px}
.qcard{background:var(--surface);border-radius:8px;padding:12px;box-shadow:var(--lift)}
.qcard select{width:auto;max-width:60%;padding:6px 8px;font-size:13px}
.qcard.late{box-shadow:inset 3px 0 0 var(--warn),var(--lift)}
.qcard-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qcard-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}

/* tooth chart */
.chart-wrap{overflow-x:auto;margin:0 -4px;padding:4px}
.chart{min-width:660px;display:flex;flex-direction:column;gap:4px;align-items:center}
.arch{display:flex;gap:12px;align-items:flex-end}
.arch.down{align-items:flex-start}
.half{display:flex;gap:1px}
.mid{width:1px;align-self:stretch;background:var(--line)}
.jaw{font-size:11px;color:var(--muted);font-weight:600;width:100%;display:flex;justify-content:space-between;padding:0 6px}
.tooth{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:5px 2px;border-radius:9px;color:var(--muted);font:700 11px/1 "Public Sans",sans-serif;font-variant-numeric:tabular-nums;transition:background-color .12s}
button.tooth{cursor:pointer}
button.tooth:hover{background:var(--sunk)}
.arch.down .tooth{flex-direction:column-reverse}
.tooth svg{display:block}
.tooth .cr{fill:var(--enamel);stroke:var(--tline);stroke-width:1.2;transition:stroke .12s}
.tooth .rt{fill:var(--root);stroke:var(--tline);stroke-width:1.2}
button.tooth:hover .cr{stroke:var(--pri)}
.tooth.sel{background:var(--pri-soft);color:var(--pri)}
.tooth.sel .cr{stroke:var(--pri);stroke-width:2.2}
.tooth.s-crown .cr{fill:var(--t-crown)}
.tooth.s-missing svg{opacity:.4}
.tooth.s-missing .cr,.tooth.s-missing .rt{fill:transparent;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);justify-content:center;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.marks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:14px;box-shadow:0 -1px 0 var(--line)}
.mk{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:34px;transition:background-color .12s,transform .1s}
.mk:active{transform:scale(.96)}
.mk i{width:10px;height:10px;border-radius:3px}
.mk:disabled{opacity:.45;cursor:not-allowed}

/* consultation */
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.chead .alerts{margin-top:10px}
.consult{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.cside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media(max-width:1099px){.consult{grid-template-columns:1fr}.cside{position:static;max-height:none}}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:750;margin-right:10px;vertical-align:1px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0}
.svc-row{display:flex;gap:8px;margin-bottom:8px}
.svc-row select{flex:2;min-width:0}.svc-row input{flex:1.4;min-width:0}.svc-row .price{flex:0 0 110px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rxchip{font:inherit;font-size:13px;border:0;background:var(--sunk);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-height:34px}
.rxchip:hover{background:var(--pri-soft);color:var(--pri)}
.pay{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:end;background:var(--sunk);border-radius:12px;padding:14px;margin-top:6px}
.pay label{margin:0}.pay b{font-size:24px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media(max-width:600px){.pay{grid-template-columns:1fr}}
.savebar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--ink);color:var(--paper);padding:10px 10px 10px 20px;border-radius:16px;box-shadow:var(--float);z-index:5}
.savebar b{display:block}
.savebar span{font-size:13px;opacity:.75}
.savebar .btn.primary{flex:0 0 auto}

/* history */
.case{padding:12px 0;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tl{list-style:none;margin:12px 0 0 5px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 4px;font-size:14px}
.tl li:last-child{padding-bottom:2px}
.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--pri)}
.tl-h{display:flex;justify-content:space-between;gap:8px}
.rx{font-size:13px;background:var(--pri-soft);padding:6px 10px;border-radius:8px;margin-top:4px;white-space:pre-line}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{border:0;padding:0;background:none;cursor:pointer;color:var(--muted);font:inherit;font-size:11px;text-align:left}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:8px;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.thumb span{display:block;margin-top:4px}

/* checkout */
.co{border-radius:12px;background:var(--sunk);padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.co-block{background:var(--surface);border-radius:8px;padding:12px}
.co-block .row-actions input,.co-block .row-actions select{width:auto}

/* kiosk */
.kiosk{max-width:620px;margin:0 auto;padding:12px 0 40px}
.kiosk h1{font-size:34px}
.ta{display:block;font-family:"Noto Sans Tamil",sans-serif;font-weight:400;color:var(--muted);font-size:.82em;line-height:1.5}
.kbig{display:grid;gap:14px;margin-top:26px}
.kbtn{font:inherit;text-align:left;padding:24px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--lift);font-size:22px;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .1s,box-shadow .15s}
.kbtn:hover{box-shadow:0 0 0 2px var(--pri)}
.kbtn:active{transform:scale(.98)}

/* ---------- tooth chart ---------- */
function toothSVG(n,st){
  const k=+String(n)[1],up=+String(n)[0]<=2;
  const type=k>=6?'m':k>=4?'p':k===3?'c':'i',W={m:42,p:32,c:30,i:28}[type],H=94,c=W/2;
  const cr=`M3,52 C3,48 6,46 10,46 H${W-10} C${W-6},46 ${W-3},48 ${W-3},52 V72 C${W-3},85 ${W-10},91 ${c},91 C10,91 3,85 3,72 Z`;
  const roots={i:`M${c-6},48 L${c-3},10 Q${c},4 ${c+3},10 L${c+6},48 Z`,c:`M${c-7},48 L${c-3},4 Q${c},0 ${c+3},4 L${c+7},48 Z`,p:`M${c-9},48 L${c-6},13 Q${c-3},7 ${c},15 Q${c+3},7 ${c+6},13 L${c+9},48 Z`,m:`M5,48 L8,14 Q11,8 14,14 L${c},34 L${W-14},14 Q${W-11},8 ${W-8},14 L${W-5},48 Z`};
  let root=`<path class="rt" d="${roots[type]}"/>`,extra='';
  if(st==='implant'){root=`<rect x="${c-6}" y="10" width="12" height="38" rx="3" fill="var(--t-implant)" opacity=".9"/>`+[16,23,30,37].map(y=>`<line x1="${c-8}" x2="${c+8}" y1="${y}" y2="${y+3}" stroke="var(--t-implant)" stroke-width="2"/>`).join('')}
  if(st==='rct')extra=type==='m'?`<path d="M11,18 L${c-3},50 M${W-11},18 L${c+3},50" stroke="var(--t-rct)" stroke-width="3" stroke-linecap="round"/>`:`<path d="M${c},10 L${c},52" stroke="var(--t-rct)" stroke-width="3" stroke-linecap="round"/>`;
  if(st==='decay')extra=`<ellipse cx="${c+2}" cy="70" rx="${W/6}" ry="6" fill="var(--t-decay)"/>`;
  if(st==='filled')extra=`<rect x="${c-W/4}" y="62" width="${W/2}" height="15" rx="5" fill="var(--t-filled)"/>`;
  if(st==='missing')extra=`<path d="M${c-6},62 L${c+6},76 M${c+6},62 L${c-6},76" stroke="var(--t-missing)" stroke-width="2" stroke-linecap="round"/>`;
  const g=`${root}<path class="cr" d="${cr}"/>${extra}`;
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${up?g:`<g transform="translate(0,${H}) scale(1,-1)">${g}</g>`}</svg>`;
}

function readFile(f,kind){return new Promise(res=>{
  if(!f.type.startsWith('image/'))return res({kind,name:f.name,type:f.type,data:''});
  const r=new FileReader();r.onerror=()=>res({kind,name:f.name,type:f.type,data:''});
  r.onload=()=>{const img=new Image();img.onerror=()=>res({kind,name:f.name,type:f.type,data:''});
    img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res({kind,name:f.name,type:'image/jpeg',data:c.toDataURL('image/jpeg',.7)})};img.src=r.result};
  r.readAsDataURL(f)})}
async function saveVisit(f,fd){
  const qi=db.queue.find(x=>x.id===ui.activeQ);if(!qi)return;
  const rows=validRows().map(r=>({name:r.name.trim(),price:+r.price||0}));
  if(!rows.length){toast('Choose at least one service');return}
  const nm=fd.get('nextMode')||'self',nv=nm==='none'?'':fd.get('nextVisit'),nt=fd.get('nextTime'),nr=fd.get('nextReason').trim();
  if(nm==='self'&&nv&&db.appointments.some(a=>a.date===nv&&a.time===nt&&a.doctorId===me()&&a.status==='booked')){toast(`You already have a booking on ${fmtD(nv)} at ${nt}. Pick another time.`);return}
  const btn=$('#saveVisit');btn.disabled=true;btn.textContent='Saving…';
  const total=sum(rows,r=>r.price);
  let caseId=fd.get('caseId');
  if(caseId==='new'){const c={id:uid(),patientId:qi.patientId,title:fd.get('caseTitle').trim()||rows[0].name+(ui.teeth.size?` – tooth ${[...ui.teeth].sort().join(', ')}`:''),status:'open',doctorId:me(),opened:today(),plan:{sittings:+fd.get('sittings')||1,estimate:can('money')?(+fd.get('estimate')||total):null}};db.cases.push(c);caseId=c.id}
  const atts=await Promise.all([...f.querySelector('[name=files]').files].map(x=>readFile(x,fd.get('attType'))));
  const mode=can('money')?fd.get('payMode'):'At reception',pr=fd.get('paid')??'',toRec=mode==='At reception',paid=toRec?0:(pr===''?total:+pr);
  const ch={...(db.charts[qi.patientId]||{})};Object.entries(ui.draft).forEach(([t,s])=>{if(s)ch[t]=s;else delete ch[t]});
  const teeth=[...ui.teeth].sort();rows.forEach(r=>{const s=db.services.find(x=>x.name===r.name);if(s?.marks)teeth.forEach(t=>ch[t]=s.marks)});
  db.charts[qi.patientId]=ch;
  db.visits.forEach(v=>{if(v.patientId===qi.patientId&&v.fu&&v.fu!=='done')v.fu='done'});
  db.visits.push({id:uid(),patientId:qi.patientId,caseId,date:today(),doctorId:me(),teeth,services:rows,notes:fd.get('notes').trim(),rx:fd.get('rx').trim(),attachments:atts,total,paid,payMode:toRec?'Pending':mode,collect:toRec?'pending':null,nextVisit:nv||null,nextReason:nr,fu:nv?(nm==='self'?'booked':'pending'):null,book:nm==='reception'?'pending':null});
  if(fd.get('closeCase'))db.cases.find(c=>c.id===caseId).status='closed';
  qi.status='done';qi.outTime=nowT();
  db.appointments.forEach(a=>{if(a.patientId===qi.patientId&&a.date===today()&&a.status==='checked-in')a.status='visited'});
  if(nm==='self'&&nv)db.appointments.push({id:uid(),patientId:qi.patientId,date:nv,time:nt,doctorId:me(),reason:nr,status:'booked'});
  ui.activeQ=null;ui.teeth=new Set();ui.draft={};ui.svcRows=[];ui.caseSel=null;
  const hand=[toRec&&'payment',nm==='reception'&&'next appointment'].filter(Boolean);
  save();toast('Visit saved'+(nm==='self'&&nv?`. Booked ${fmtD(nv)} at ${nt}`:'')+(hand.length?`. Sent to reception for ${hand.join(' and ')}`:''));go(isLive()?'live':'queue');
}

      const appt=db.appointments.find(a=>a.patientId===p.id&&a.date===today()&&a.status==='booked');
      const existing=db.queue.find(x=>x.date===today()&&x.patientId===p.id&&x.status!=='done');
      const tok=existing?existing.token:addToQueue(p.id,appt?.doctorId||owner().id,appt?'appointment':'tablet');if(appt&&!existing)appt.status='checked-in';save();kioskDone(p.id,tok);break}
    case'appt':{let pid=fd.get('patientId');
      if(pid==='new'){const name=(fd.get('newName')||'').trim(),phone=(fd.get('newPhone')||'').trim();
        if(!name||!/^\d{10}$/.test(phone)){toast('Enter a name and a 10-digit mobile number');return}
        const ex=db.patients.find(p=>p.phone===phone);pid=ex?ex.id:newPt({name,phone}).id}
      const date=fd.get('date'),time=fd.get('time'),doctorId=fd.get('doctorId');
      if(db.appointments.some(a=>a.date===date&&a.time===time&&a.doctorId===doctorId&&a.status==='booked')){toast(`${D(doctorId).name} is already booked at ${time}`);return}
      db.appointments.push({id:uid(),patientId:pid,date,time,doctorId,reason:fd.get('reason').trim(),status:'booked'});
      db.visits.forEach(v=>{if(v.patientId===pid&&v.fu&&v.fu!=='done')v.fu='booked'});
      ui.apptPatient=null;ui.apptReason='';ui.apptDate=date;save();toast(`Booked ${P(pid).name} for ${fmtD(date)} at ${time}`);render();break}
    case'visit':await saveVisit(f,fd);break;
    case'addService':db.services.push({id:uid(),name:fd.get('name').trim(),price:+fd.get('price')||0,active:true,marks:fd.get('marks')||null});save();render();toast('Service added');break;
    case'expense':db.expenses.push({id:uid(),date:fd.get('date'),category:fd.get('category'),item:fd.get('item').trim(),amount:+fd.get('amount')||0,vendor:fd.get('vendor').trim()});ui.expMonth=fd.get('date').slice(0,7);save();render();toast('Expense added');break;
    case'staff':db.staff.push({id:uid(),name:fd.get('name').trim(),role:'junior',perms:{}});save();render();toast('Doctor added');break;
    case'clinic':db.clinic={name:fd.get('name').trim()||'Clinic',phone:fd.get('phone').trim(),template:fd.get('template')};save();render();toast('Clinic details saved');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true});
setInterval(()=>{if(ui.view==='live'&&!document.activeElement?.matches('select,input,textarea')){try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}render()}},10000);
window.addEventListener('hashchange',render);
render();
</script>
</body>
